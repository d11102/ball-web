<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141428">
  <title>Dowon - Breakout Game</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="sketch.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="heading">
      <p class="eyebrow">ARCADE GAME</p>
      <h1>BREAKOUT</h1>
      <p class="subtitle">마우스로 패들을 움직여 모든 블록을 부수세요!</p>
    </header>

    <section class="game-shell" aria-label="벽돌 깨기 게임">
      <div id="game-container"></div>
    </section>

    <p class="help">조작: 마우스 이동 · 모바일은 터치 · 게임 종료 후 스페이스바로 재시작</p>
  </main>
</body>
</html>
